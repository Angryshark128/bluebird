name: CI

# push main / PR 跑测试（日常回归门禁）；打 v* tag 额外构建镜像并发布
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法检查
        run: python3 -m py_compile server.py
      - name: 单元测试
        run: python3 -m unittest discover -s tests -v
      - name: 构建镜像
        run: docker build -t bluebird:test .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: 构建并推送镜像
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE:${GITHUB_REF_NAME} -t $IMAGE:latest .
          docker push $IMAGE:${GITHUB_REF_NAME}
          docker push $IMAGE:latest
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
