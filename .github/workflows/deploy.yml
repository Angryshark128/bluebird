name: Deploy

# 青鸟 Bluebird 业务仓库 CI/CD（2026-09-19 改造为 app-deploy 统一部署链路）
#
#   - 业务仓库只做两件事：跑测试、把镜像推到 ghcr（零 registry secret、零 SSH key）
#   - 「镜像分发到 ACR + SSH 部署到主机」由私有仓库 hancic128/app-deploy 执行
#   - 部署后的探活由 app-deploy 侧的 services/bluebird/healthcheck.sh 负责
#
# 触发纪律：**只允许打 v* tag**（不允许 push branches / pull_request 自动跑，省 Actions 额度）。
# 日常回归在本地 `python3 -m unittest discover -s tests`；本仓库不再有 PR 自动测试。
#
# 前置 secret（仓库 Settings → Secrets and variables → Actions）：
#   APP_DEPLOY_DISPATCH_TOKEN —— fine-grained PAT，Contents: Read and write，
#                                仅授权 hancic128/app-deploy（缺了会 403）
# 推 ghcr 用自带的 GITHUB_TOKEN，不需要任何额外 secret。

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # 推镜像到 ghcr 需要 packages: write（缺此项会报
  # "installation not allowed to Create organization package"）
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 的 python:3.11-alpine 对齐，测的就是线上运行时
          python-version: "3.11"
      - name: 语法检查
        run: python3 -m py_compile server.py
      - name: 单元测试
        run: python3 -m unittest discover -s tests -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 镜像名/仓库名必须与 app-deploy 的镜像搬运规则一致：
          #   ghcr.io/hancic128/bluebird:<TAG>  ->  ACR/hancic128/bluebird:<TAG>
          # <TAG> 就是 git tag 名；app-deploy 直接按这个地址拉取，改名会导致部署失败。
          tags: |
            ghcr.io/hancic128/bluebird:${{ github.ref_name }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 保留改造前的「打 tag 生成 Release notes」行为；不需要可直接删掉本 job
  dispatch:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 触发 app-deploy（镜像搬运 + 部署 + 健康检查）
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APP_DEPLOY_DISPATCH_TOKEN }}
          repository: hancic128/app-deploy
          event-type: deploy
          # app 必须等于 app-deploy 里 services/<app> 的目录名；tag 就是本次 git tag
          client-payload: '{"app":"bluebird","tag":"${{ github.ref_name }}"}'
